# Exclut du GitHub Secret Scanning les fichiers qui contiennent, de façon
# INTENTIONNELLE, des clés « client » non sensibles :
#   * Clés Google Maps  -> restreintes par package + SHA-1 (Android) et par
#     bundle ID (iOS) : une clé volée est inutilisable ailleurs.
#   * Clés Firebase     -> identifiants publics par conception ; la sécurité
#     repose sur les Security Rules et App Check, pas sur le masquage.
#
# Ces clés sont de toute façon livrées dans l'app (extractibles de l'APK/IPA),
# donc les cacher n'apporte rien. La vraie protection reste la RESTRICTION des
# clés dans Google Cloud Console — pas ce fichier, qui ne fait que taire le
# scanner pour ces chemins précis.
paths-ignore:
  - "android/app/src/main/AndroidManifest.xml"
  - "ios/Runner/AppDelegate.swift"
  - "lib/firebase_options.dart"
  - "android/app/google-services.json"
  - "ios/Runner/GoogleService-Info.plist"
